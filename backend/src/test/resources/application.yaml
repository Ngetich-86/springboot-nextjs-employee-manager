app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: test-secret-key-with-at-least-256-bits-for-hmac-sha256-signing-integration-tests
    expiration-ms: 3600000
  rate-limit:
    auth:
      capacity: 10000
      refill-tokens: 10000
      refill-duration-minutes: 1

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
