services:
  postgres:
    image: postgres:16-alpine
    container_name: pesira-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pesira_ems}
      POSTGRES_USER: ${DB_USER:-pesira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pesira}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pesira} -d ${DB_NAME:-pesira_ems}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pesira-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pesira_ems}
      DB_USER: ${DB_USER:-pesira}
      DB_PASSWORD: ${DB_PASSWORD:-pesira}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret-key-at-least-256-bits}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: pesira-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
